name: Validate and deploy portfolio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e -- --workers=2

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    concurrency:
      group: ugurdindar-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build production image
        env:
          DEPLOY_IMAGE: ugurdindar.com:${{ github.sha }}
        run: docker build --pull -t "$DEPLOY_IMAGE" .
      - name: Check and replace production container
        env:
          PORT: ${{ secrets.PORT }}
          DEPLOY_IMAGE: ugurdindar.com:${{ github.sha }}
        run: bash .github/scripts/deploy.sh
